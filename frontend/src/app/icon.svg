<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark (components/auth-shell.tsx Logo) on a dark tile, so it reads on light and
       dark browser tabs alike (Prompt 82). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f2ec" />
      <stop offset="0.5" stop-color="#a8c5b3" />
      <stop offset="1" stop-color="#16a34a" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#050806" />
  <rect x="8.5" y="8.5" width="15" height="15" rx="4.5" fill="url(#g)" transform="rotate(45 16 16)" />
</svg>
