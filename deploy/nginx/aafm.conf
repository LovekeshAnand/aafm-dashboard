# Nginx in front of the API on EC2 (Prompt 56). Browsers reach it only through Cloudflare:
# the pages come from the Cloudflare Worker, and /api and /socket.io are routed here.
server_tokens off;

# Problems-log #13: the real client IP. Cloudflare sends it in CF-Connecting-IP; it is trusted
# ONLY when the connection really comes from a Cloudflare address (the list is generated by
# deploy/scripts/update-cloudflare-ips.sh). After this, $remote_addr is the client.
include /etc/nginx/cloudflare-real-ip.conf;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream api {
  server api:8000;
  keepalive 16;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # Cloudflare Origin CA certificate (Cloudflare -> origin is encrypted and authenticated;
  # SSL/TLS mode "Full (strict)").
  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 128k; # the API accepts at most 100 KB of JSON
  client_body_timeout 15s;
  client_header_timeout 15s;

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Replace, never append: a client-supplied X-Forwarded-For must not reach the API.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id; # E22: one id from the edge to the audit log
    proxy_read_timeout 35s; # the API's own request timeout is 30 s
  }

  # Socket.IO: WebSocket upgrade, plus long-polling held up to 25 s (pingInterval).
  location /socket.io {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 70s;
  }

  # Everything else is the frontend's job (Cloudflare Worker); nothing else is served here.
  location / {
    return 404;
  }
}
